plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.mkmedia.obdscanner'
    compileSdk 34

    defaultConfig {
        applicationId 'pt.mkmedia.obdscanner'
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName '1.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        stable {
            storeFile file("obd-release.jks")
            storePassword "obdscanner2024"
            keyAlias "obd"
            keyPassword "obdscanner2024"
        }
    }

    buildTypes {
        debug {
            def ks = file("obd-release.jks")
            if (ks.exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
