plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.mkmedia.obdscanner'
    compileSdk 34

    defaultConfig {
        applicationId 'pt.mkmedia.obdscanner'
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName '2.2.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Постоянный ключ подписи: файл release.jks кладёт сборка GitHub из секрета SIGNING_KEY_B64.
    // Если файла нет — подписывается временным debug-ключом (обновление поверх не встанет).
    signingConfigs {
        mk {
            storeFile file('release.jks')
            storePassword 'obdscanner2024'
            keyAlias 'obd'
            keyPassword 'obdscanner2024'
        }
    }

    buildTypes {
        debug {
            if (file('release.jks').exists()) {
                signingConfig signingConfigs.mk
            }
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
