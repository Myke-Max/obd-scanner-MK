name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Build
        run: gradle assembleDebug --no-daemon --refresh-dependencies
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: obd-scanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Send APK to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          VERSION=$(grep versionName app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          MSG="OBD Scanner v${VERSION} готов. Установи APK."
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT}" \
            -F document=@"app/build/outputs/apk/debug/app-debug.apk" \
            --form-string caption="${MSG}"
